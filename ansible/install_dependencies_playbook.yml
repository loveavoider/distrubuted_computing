---
- name: Install dependencies
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    venv_path: "/opt/myvenv"

  tasks:
    - name: Install required system packages
      become: true
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Создание виртуального окружения
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ venv_path }}"
        virtualenv_command: "python3 -m venv"

    - name: Install packages in virtualenv
      ansible.builtin.pip:
        name:
          - "psycopg2-binary"
          - "requests"
        virtualenv: "{{ venv_path }}"
        state: present
